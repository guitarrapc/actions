name: PR Harness

on:
  pull_request:
    branches: ["main"]
  workflow_call:
    inputs:
      license-check:
        description: "Run ol license policy check with resolved package-manager inputs."
        required: false
        default: false
        type: boolean
      allow-licenses:
        description: "Comma-separated SPDX License Identifiers allowed by ol."
        required: false
        default: "Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MPL-2.0"
        type: string
      allow-dev-licenses:
        description: "Comma-separated SPDX License Identifiers additionally allowed for proven development-only dependencies."
        required: false
        default: ""
        type: string
      additional-license-baseline-paths:
        description: "Newline-separated additional committed ol baselines applied before the optional repository ol-baseline.json."
        required: false
        default: ""
        type: string
      exclude-license-input-paths:
        description: "Newline-separated repository files or directories excluded from package-manager discovery and ol input discovery."
        required: false
        default: ""
        type: string

jobs:
  prevent-githubactions-changes:
    permissions:
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;

            if (!pr) {
              core.info("This workflow only checks pull request events.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const changedFiles = files.map(file => file.filename);
            const isExternalPr = pr.head.repo.full_name !== pr.base.repo.full_name;

            if (!isExternalPr) {
              core.info("Not an external contributor PR.");
              return;
            }

            const blocked = changedFiles.filter(name =>
              /^\.github\/workflows\/.*\.ya?ml$/.test(name) ||
              /^\.github\/actions\/.*$/.test(name) ||
              /^\.github\/dependabot\.ya?ml$/.test(name) ||
              name === ".github/CODEOWNERS"
            );

            if (blocked.length > 0) {
              core.setFailed(
                `External contributor PR may not change protected files:\n${blocked.join("\n")}`
              );
              return;
            }

            core.info("No protected files changed by external contributor.");

  dependency-review:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: "Dependency Review"
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # 5.0.0
        with:
          allow-licenses: ${{ inputs.allow-licenses || 'Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MPL-2.0' }}
          license-check: true
          vulnerability-check: true

  license-check:
    # Callers opt in with the license-check input; this repository's own PRs always run it to exercise the job.
    if: ${{ inputs.license-check || github.repository == 'guitarrapc/actions' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true
          path: repo
      # Shared ol baseline and seed cache.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: guitarrapc/actions
          path: Actions
      # ol scans resolved dependency graphs; producing them belongs to each ecosystem's toolchain.
      - uses: guitarrapc/actions/.github/actions/restore-dotnet@main
        with:
          working-directory: repo
          exclude-paths: ${{ inputs.exclude-license-input-paths }}
      - uses: guitarrapc/setup-ol/check@v1.1.0
        with:
          working-directory: repo
          allow-licenses: ${{ inputs.allow-licenses || 'Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MPL-2.0' }}
          allow-dev-licenses: ${{ inputs.allow-dev-licenses }}
          exclude-input-paths: ${{ inputs.exclude-license-input-paths }}
          # The shared baseline is optional and applies after the caller's baselines.
          baselines: |
            ${{ inputs.additional-license-baseline-paths }}
            ${{ hashFiles('Actions/ol-baseline.json') != '' && '../Actions/ol-baseline.json' || '' }}
          seed-cache: ../Actions/ol-cache.olcache

  pr-harness-check:
    # Run even when optional checks are skipped, then fail explicitly on any failed or cancelled check.
    if: ${{ !cancelled() }}
    needs: [prevent-githubactions-changes, dependency-review, license-check]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: "Fail on failed checks"
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::One or more PR Harness checks failed or were cancelled."
          exit 1
      - name: "Pass"
        run: echo "PR Harness checks passed."
