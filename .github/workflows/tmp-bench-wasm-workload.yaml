name: "TMP: bench wasm workload install"

on:
  push:
    branches: ["fix/setup-dotnet-wasm-skip-manifest-update"]

jobs:
  bench:
    name: bench (${{ matrix.os }}, ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, windows-11-arm, macos-26, macos-26-intel]
        mode: [before, after]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: setup-dotnet (before)
        if: ${{ matrix.mode == 'before' }}
        uses: guitarrapc/actions/.github/actions/setup-dotnet@9122a18b0dea07585a242b9eb6ed7886f8587c49 # v1.0.1
        with:
          restore-wasm-workload: true
          dotnet-version: |
            10.0.x
            8.0.x
      - name: setup-dotnet (after)
        if: ${{ matrix.mode == 'after' }}
        uses: ./.github/actions/setup-dotnet
        with:
          restore-wasm-workload: true
          dotnet-version: |
            10.0.x
            8.0.x
      - name: dotnet workload list
        shell: bash
        run: |
          command -v dotnet
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          dotnet --list-sdks
          dotnet workload list
      # AOT publish goes through the Emscripten toolchain, so this proves the installed wasm-tools actually works.
      - name: Publish blazorwasm with AOT
        shell: bash
        run: |
          dotnet new blazorwasm -o "$RUNNER_TEMP/wasmapp"
          dotnet publish "$RUNNER_TEMP/wasmapp" -c Release -p:RunAOTCompilation=true -o "$RUNNER_TEMP/wasmapp-out"
          ls "$RUNNER_TEMP/wasmapp-out/wwwroot/_framework" | head -20
