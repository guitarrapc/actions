name: Test GitHub Actions

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  git-shortsha:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/git-shortsha
        id: git-shortsha
      - name: Show action output
        run: echo "${{ steps.git-shortsha.outputs.sha-short }}"
      - name: Test action output
        run: if [[ "${{ steps.git-shortsha.outputs.sha-short }}" == "" ]]; then exit 1; fi

  setup-dotnet:
    strategy:
      matrix:
        restore-wasm-workload: ["", "true", "false"]
        skip-env: ["", "true", "false"]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
        with:
          restore-wasm-workload: ${{ matrix.restore-wasm-workload }}
          skip-env: ${{ matrix.skip-env }}
      - name: dotnet build
        run: dotnet build
        working-directory: sandbox/

  # Windows installs the SDK under runner.temp when the wasm workload is requested, so the workload
  # skips the Visual Studio MAUI/iOS/Android workloads that the Program Files SDK drags along.
  setup-dotnet-wasm-windows:
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
        with:
          restore-wasm-workload: true
      - name: dotnet resolves to the SDK under runner.temp
        shell: bash
        run: |
          expected="$(cygpath -u "$RUNNER_TEMP")/dotnet"
          actual="$(dirname "$(command -v dotnet)")"
          echo "expected=$expected actual=$actual DOTNET_ROOT=$DOTNET_ROOT"
          [[ "$actual" == "$expected" ]]
          [[ "$(cygpath -u "$DOTNET_ROOT")" == "$expected" ]]
      - name: wasm-tools is installed
        shell: bash
        run: dotnet workload list | grep -E '^wasm-tools[[:space:]]'
      - name: dotnet build
        run: dotnet build
        working-directory: sandbox/

  to-lower:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/to-lower
        id: to-lower
        with:
          value: FOOBar_baz-Piyo
      - name: Show output
        run: |
          echo "repository => ${{ steps.to-lower.outputs.repository }}"
          echo "value      => ${{ steps.to-lower.outputs.value }}"
      - name: Repository name
        run: if [[ "${{ steps.to-lower.outputs.repository }}" != "${{ github.repository }}" ]]; then exit 1; fi
      - name: Test action output
        run: if [[ "${{ steps.to-lower.outputs.value }}" != "foobar_baz-piyo" ]]; then exit 1; fi
